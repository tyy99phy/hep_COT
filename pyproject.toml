[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hep-cot"
version = "0.2.0"
description = "HEP Paper Literature Reasoning Copilot + Comparative CoT Study"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
hep-cot = "hep_cot.cli:main"
hep-copilot = "hep_cot.cli:main"

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23"]
all = ["PyMuPDF>=1.23"]

[tool.setuptools.packages.find]
where = ["src"]
